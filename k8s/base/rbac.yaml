apiVersion: v1
kind: ServiceAccount
metadata:
  name: energy-app
  labels:
    app.kubernetes.io/part-of: energy-intelligence
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: energy-data
  labels:
    app.kubernetes.io/part-of: energy-intelligence
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: energy-monitoring
  labels:
    app.kubernetes.io/part-of: energy-intelligence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: energy-app-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: energy-app-config-reader
subjects:
  - kind: ServiceAccount
    name: energy-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: energy-app-config-reader
