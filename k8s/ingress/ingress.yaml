apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: energy-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - energy-thinktank.com
      secretName: prod-external-api-secrets
  rules:
    - host: energy-thinktank.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
---
# 速率限制中间件 (需要安装nginx-ingress自定义资源)
# 监控面板入口通过 basic-auth 保护,凭据来自外部密钥契约。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: energy-monitoring
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prod-monitoring-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: energy-monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: monitoring.energy-thinktank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
