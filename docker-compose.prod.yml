# 新能源智库 — 生产环境 Docker Compose
# 用法: docker compose -f docker-compose.prod.yml up -d

name: energy

services:
  postgres:
    image: postgres:16-alpine
    container_name: energy-postgres
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: energy-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped

  backend:
    build:
      context: ./后端
      dockerfile: Dockerfile
    container_name: energy-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://energy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/energy
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://energy-thinktank.com","https://cn.energy-thinktank.com"]}
      - VECTOR_STORE_BACKEND=${VECTOR_STORE_BACKEND:-milvus}
      - MILVUS_HOST=${MILVUS_HOST:?MILVUS_HOST must be set}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@energy-thinktank.com}
      - STORAGE_PROVIDER=oss
      - OSS_BUCKET=${OSS_BUCKET:?OSS_BUCKET must be set}
      - OSS_ENDPOINT=${OSS_ENDPOINT:?OSS_ENDPOINT must be set}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID must be set}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET must be set}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend-cn:
    build:
      context: .
      dockerfile: frontend-cn-web/Dockerfile
    container_name: energy-frontend-cn
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_USE_MOCK_DATA=false
    depends_on:
      - backend
    restart: unless-stopped

  frontend-int:
    build:
      context: .
      dockerfile: web-global/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: energy-frontend-int
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: energy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-cn
      - frontend-int
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg-data:
  redis-data:
  backend-data:
  backend-uploads:
  backend-logs:
