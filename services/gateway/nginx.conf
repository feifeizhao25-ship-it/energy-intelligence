# gateway — edge proxy for the 新能源智库 microservice mesh.
# Routes public API prefixes to the in-cluster ClusterIP services.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    upstream auth_service { server auth-service:8000; }
    upstream user_service { server user-service:8000; }
    upstream project_service { server project-service:8000; }
    upstream resource_service { server resource-service:8000; }
    upstream financial_service { server financial-service:8000; }
    upstream simulation_service { server simulation-service:8000; }
    upstream diagnostic_service { server diagnostic-service:8000; }
    upstream ai_engine_service { server ai-engine-service:8000; }
    upstream knowledge_service { server knowledge-service:8000; }
    upstream report_service { server report-service:8000; }
    upstream analytics_service { server analytics-service:8000; }
    upstream notification_service { server notification-service:8000; }
    upstream billing_service { server billing-service:8000; }
    upstream monetization_service { server monetization-service:8000; }

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/ {
            proxy_pass http://user_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/projects/ {
            proxy_pass http://project_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/resources/ {
            proxy_pass http://resource_service/;
            proxy_set_header Host $host;
        }

        location /api/financial/ {
            proxy_pass http://financial_service/;
            proxy_set_header Host $host;
        }

        location /api/simulations/ {
            proxy_pass http://simulation_service/;
            proxy_set_header Host $host;
        }

        location /api/diagnostics/ {
            proxy_pass http://diagnostic_service/;
            proxy_set_header Host $host;
        }

        location /api/ai/ {
            proxy_pass http://ai_engine_service/;
            proxy_set_header Host $host;
        }

        location /api/knowledge/ {
            proxy_pass http://knowledge_service/;
            proxy_set_header Host $host;
        }

        location /api/reports/ {
            proxy_pass http://report_service/;
            proxy_set_header Host $host;
        }

        location /api/analytics/ {
            proxy_pass http://analytics_service/;
            proxy_set_header Host $host;
        }

        location /api/notifications/ {
            proxy_pass http://notification_service/;
            proxy_set_header Host $host;
        }

        location /api/billing/ {
            proxy_pass http://billing_service/;
            proxy_set_header Host $host;
        }

        location /api/monetization/ {
            proxy_pass http://monetization_service/;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
