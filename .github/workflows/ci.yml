name: CI

on:
  push:
    branches: [main, codex/production-readiness-20260729]
  pull_request:
    branches: [main]

concurrency:
  group: energy-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 后端
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 后端/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q --disable-warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 8.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend-cn-web type-check
      - run: pnpm --dir frontend-cn-web build
      - run: pnpm --dir web-global type-check
      - run: pnpm --dir web-global build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/verify_production_code.py
      - run: python3 scripts/verify_k8s_production.py
      - run: python3 scripts/verify_compose_production.py
