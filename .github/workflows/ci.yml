name: 新能源智库 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 1. Backend Tests
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Test (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Syntax check all .py files
        run: |
          find . -name "*.py" -exec python -m py_compile {} +
          echo "✅ All Python files passed syntax check"

      - name: Run pytest (exclude slow tests)
        run: |
          python -m pytest tests/ \
            -m "not slow" \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────
  # 2. Frontend CN Build
  # ──────────────────────────────────────────
  frontend-cn-build:
    name: Frontend CN Build (Next.js)
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: frontend-cn-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-cn-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cn-build
          path: frontend-cn-web/.next/
          retention-days: 7

  # ──────────────────────────────────────────
  # 3. Frontend Global Build
  # ──────────────────────────────────────────
  frontend-global-build:
    name: Frontend Global Build (Next.js)
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: web-global

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-global/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-global-build
          path: web-global/.next/
          retention-days: 7

  # ──────────────────────────────────────────
  # 4. Translation Check
  # ──────────────────────────────────────────
  translation-check:
    name: Translation Coverage Check (95%)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Run translation key checker
        run: |
          python scripts/check_translation_keys.py --threshold 95

  # ──────────────────────────────────────────
  # 5. Lint
  # ──────────────────────────────────────────
  lint:
    name: Lint (flake8 + eslint)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8

      - name: Lint backend with flake8
        run: |
          flake8 backend/app/ \
            --max-line-length=120 \
            --exclude=__pycache__,.venv,migrations \
            --statistics

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint frontend-cn-web with eslint
        working-directory: frontend-cn-web
        run: |
          npm ci
          npx eslint src/ --max-warnings=0 || true

      - name: Lint web-global with eslint
        working-directory: web-global
        run: |
          npm ci
          npx eslint src/ --max-warnings=0 || true
