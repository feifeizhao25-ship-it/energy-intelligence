name: Axe (domestic web)

# 只检查国内站 runtime/web 的可访问性冒烟（tests/e2e/axe-smoke.spec.ts 里的 @cn 用例）。
# 国际版（web-global、runtime/web-int）不在这里跑。不调用任何模型、支付或地图服务，所有密钥置空。
on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/web/**'
      - 'tests/e2e/axe-smoke.spec.ts'
      - 'playwright.axe.config.ts'
      - '.github/workflows/axe-cn.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/web/**'
      - 'tests/e2e/axe-smoke.spec.ts'
      - 'playwright.axe.config.ts'
      - '.github/workflows/axe-cn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axe-cn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-cn:
    name: Axe smoke (domestic web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      AXE_PROJECTS: cn
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install root test tooling (Playwright, axe)
        run: pnpm install --frozen-lockfile

      - name: Install domestic web dependencies
        working-directory: runtime/web
        run: npm ci

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run domestic axe smoke
        run: pnpm exec playwright test -c playwright.axe.config.ts --project=cn

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axe-cn-results
          path: test-results/
          retention-days: 7
