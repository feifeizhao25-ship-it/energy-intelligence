name: Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天凌晨 2 点运行一次完整扫描
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  # ── Python SAST (Bandit) ───────────────────────────────────────────────
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml] bandit-sarif-formatter

      - name: Run Bandit on backend
        run: |
          bandit -r backend/app backend/skills -f sarif -o bandit-results.sarif || true
          bandit -r backend/app backend/skills -f json -o bandit-results.json || true
          # 同时输出到控制台，任何 HIGH/CRITICAL 即失败
          bandit -r backend/app backend/skills -ll -ii
        continue-on-error: true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Check Bandit severity
        run: |
          if [ -f bandit-results.json ]; then
            HIGH=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r['issue_severity'] in ('HIGH','CRITICAL')]))" < bandit-results.json)
            echo "Bandit HIGH/CRITICAL issues: $HIGH"
            if [ "$HIGH" -gt 0 ]; then
              echo "❌ Bandit found $HIGH HIGH/CRITICAL severity issues"
              exit 1
            fi
          fi

  # ── Python Dependency Audit (pip-audit) ────────────────────────────────
  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          cd backend
          pip-audit -r requirements.txt --desc --format=json -o pip-audit.json || true
          pip-audit -r requirements.txt --desc
        continue-on-error: true

      - name: Check pip-audit severity
        run: |
          if [ -f backend/pip-audit.json ]; then
            CRITICAL=$(python3 -c "
import json,sys
d=json.load(sys.stdin)
cnt=sum(1 for dep in d.get('dependencies',[]) for vuln in dep.get('vulns',[]) if vuln.get('fix_versions'))
print(cnt)
" < backend/pip-audit.json)
            echo "Python dependencies with fixable vulnerabilities: $CRITICAL"
            if [ "$CRITICAL" -gt 10 ]; then
              echo "⚠️ $CRITICAL fixable vulnerabilities found (threshold: 10)"
              exit 1
            fi
          fi

  # ── Secret Scanning (TruffleHog) ───────────────────────────────────────
  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ── Node.js Dependency Audit ───────────────────────────────────────────
  npm-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # frontend-cn-web 是空壳目录，审计它等于什么都没审计。
        # 改为主干 runtime/web 与 runtime/web-int。
        workspace: [runtime/web, runtime/web-int, web-global, apps/api, packages/analytics]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            cd ${{ matrix.workspace }}
            pnpm install --frozen-lockfile
          else
            echo "Skipping ${{ matrix.workspace }} (no package.json)"
            exit 0
          fi

      - name: Run npm audit
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            cd ${{ matrix.workspace }}
            pnpm audit --audit-level high || true
          fi

      - name: Check audit severity
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            cd ${{ matrix.workspace }}
            # pnpm audit --json 输出不稳定，使用 npm audit 作为备用
            if [ -f "package-lock.json" ]; then
              npm audit --audit-level=high --production
            else
              echo "No package-lock.json, skipping strict audit"
            fi
          fi
        continue-on-error: true

  # ── Container Image Scan (Trivy) ───────────────────────────────────────
  trivy-image:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: |
          if [ -f "apps/api/Dockerfile" ]; then
            docker build -f apps/api/Dockerfile -t eip-api:scan apps/api
          elif [ -f "backend/Dockerfile" ]; then
            docker build -f backend/Dockerfile -t eip-api:scan backend
          else
            echo "No Dockerfile found, skipping image scan"
            exit 0
          fi

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'eip-api:scan'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  # ── Infrastructure as Code Scan (Checkov) ──────────────────────────────
  checkov:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile,kubernetes,github_actions
          output_format: sarif
          output_file_path: reports/checkov.sarif
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/checkov.sarif
          category: checkov

  # ── CodeQL Analysis ────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── Security Summary ───────────────────────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [bandit, pip-audit, trufflehog, npm-audit, trivy-image, checkov, codeql]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## 🔒 Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (Python SAST) | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (Python deps) | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog (Secrets) | ${{ needs.trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm-audit (Node deps) | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Image Scan | ${{ needs.trivy-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov (IaC) | ${{ needs.checkov.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
