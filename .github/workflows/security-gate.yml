name: Security Gate

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天凌晨 2 点运行一次完整扫描
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ── Python SAST (Bandit) ───────────────────────────────────────────────
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml] bandit-sarif-formatter

      - name: Run Bandit on backend
        run: |
          # 中高风险且置信度为中高的发现立即阻断；SARIF 仍由后续 always() 步骤上传。
          bandit -r runtime/backend/app -ll -ii -f sarif -o bandit-results.sarif

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ── Python Dependency Audit (pip-audit) ────────────────────────────────
  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          cd runtime/backend
          pip-audit -r requirements.txt --desc --format=json -o pip-audit.json

      - name: Enforce zero known Python vulnerabilities
        run: |
          TOTAL=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(dep.get('vulns', [])) for dep in d.get('dependencies', [])))" < runtime/backend/pip-audit.json)
          echo "Known Python dependency vulnerabilities: $TOTAL"
          test "$TOTAL" -eq 0

  # ── Secret Scanning (TruffleHog) ───────────────────────────────────────
  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (push range)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (pull request range)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (full repository)
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ── Node.js Dependency Audit ───────────────────────────────────────────
  npm-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # frontend-cn-web 是空壳目录，审计它等于什么都没审计。
        # 改为主干 runtime/web 与 runtime/web-int。
        workspace: [runtime/web, runtime/web-int, web-global, apps/api, packages/analytics]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.0

      - name: Install dependencies
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            cd ${{ matrix.workspace }}
            pnpm install --frozen-lockfile
          else
            echo "Skipping ${{ matrix.workspace }} (no package.json)"
            exit 0
          fi

      - name: Run npm audit
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            cd ${{ matrix.workspace }}
            pnpm audit --audit-level high
          fi

      - name: Check audit severity
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            cd ${{ matrix.workspace }}
            # pnpm audit --json 输出不稳定，使用 npm audit 作为备用
            if [ -f "package-lock.json" ]; then
              npm audit --audit-level=high --production
            else
              echo "No package-lock.json, skipping strict audit"
            fi
          fi

  # ── Container Image Scan (Trivy) ───────────────────────────────────────
  trivy-image:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: |
          if [ -f "apps/api/Dockerfile" ]; then
            docker build -f apps/api/Dockerfile -t eip-api:scan apps/api
          elif [ -f "runtime/backend/Dockerfile" ]; then
            docker build -f runtime/backend/Dockerfile -t eip-api:scan runtime/backend
          else
            echo "No Dockerfile found, skipping image scan"
            exit 0
          fi

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'eip-api:scan'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  # ── Infrastructure as Code Scan (Checkov) ──────────────────────────────
  checkov:
    name: Production Kubernetes Security (Checkov)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Render production manifests
        run: |
          mkdir -p reports
          kubectl kustomize k8s/overlays/production > reports/production-k8s.yaml
          test -s reports/production-k8s.yaml

      - name: Verify production runtime hardening
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 scripts/verify_production_k8s_security.py reports/production-k8s.yaml

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: reports/production-k8s.yaml
          framework: kubernetes
          # Compensating controls above enforce non-root execution, immutable
          # SHA/version tags, no literal secrets and complete runtime hardening.
          # Digests are only known after the release build; several upstream
          # images intentionally use their documented non-root UID.
          skip_check: CKV_K8S_35,CKV_K8S_40,CKV_K8S_43
          output_format: sarif
          output_file_path: reports/checkov.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/checkov.sarif
          category: checkov

  # ── CodeQL Analysis ────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # checkov:skip=CKV2_GHA_1: SARIF upload requires only security-events:write; code and actions remain read-only.
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ── Security Summary ───────────────────────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [bandit, pip-audit, trufflehog, npm-audit, trivy-image, checkov, codeql]
    if: always()
    steps:
      - name: Summarize results
        run: |
          {
            echo "## 🔒 Security Gate Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Bandit (Python SAST) | ${{ needs.bandit.result }} |"
            echo "| pip-audit (Python deps) | ${{ needs.pip-audit.result }} |"
            echo "| TruffleHog (Secrets) | ${{ needs.trufflehog.result }} |"
            echo "| npm-audit (Node deps) | ${{ needs.npm-audit.result }} |"
            echo "| Trivy Image Scan | ${{ needs.trivy-image.result }} |"
            echo "| Checkov (IaC) | ${{ needs.checkov.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
