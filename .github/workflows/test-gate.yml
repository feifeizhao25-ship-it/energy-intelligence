name: Test Gate

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  COVERAGE_THRESHOLD: 55

jobs:
  # ── Python Backend Tests ────────────────────────────────────────────────
  python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run alembic migrations (test DB)
        run: |
          cd runtime/backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Run pytest with coverage
        run: |
          cd runtime/backend
          pytest tests/ -v \
            --cov=app --cov=skills \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          PYTHONPATH: ${{ github.workspace }}/runtime/backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: runtime/backend/coverage.xml

  # ── Authorization and market-isolation validation ─────────────────────
  data-isolation:
    name: Authorization & Market Isolation
    runs-on: ubuntu-latest
    needs: [python-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/backend/requirements.txt
          pip install pytest pytest-asyncio asyncpg

      - name: Run ownership, authentication and market-isolation tests
        run: |
          cd runtime/backend
          pytest \
            tests/test_auth.py \
            tests/test_report_production_safety.py \
            tests/test_report_entitlements.py \
            tests/test_ai_observability.py \
            tests/test_rag_freshness_language.py \
            tests/test_all_skills_and_rag.py \
            -v
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime/backend

  # ── Node.js Unit Tests ─────────────────────────────────────────────────
  node-unit:
    name: Node.js Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-coverage
          path: coverage/

  # ── E2E Tests (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [python-unit, node-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CN web dependencies
        working-directory: runtime/web
        run: npm ci

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ── Coverage Gate ──────────────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate (≥55%)
    runs-on: ubuntu-latest
    needs: [python-unit, node-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: ./python-coverage

      - name: Parse Python coverage
        id: py_cov
        run: |
          if [ -f python-coverage/coverage.xml ]; then
            # 提取行覆盖率（简单 XML 解析）
            COV=$(grep -o 'line-rate="[0-9.]*"' python-coverage/coverage.xml | head -1 | grep -o '[0-9.]*')
            PCT=$(python3 -c "print(f'{float('$COV')*100:.1f}')")
            echo "python_coverage=$PCT" >> $GITHUB_OUTPUT
            echo "Python coverage: $PCT%"
          else
            echo "python_coverage=0" >> $GITHUB_OUTPUT
            echo "No Python coverage report found"
          fi

      - name: Enforce threshold
        run: |
          PY_COV=${{ steps.py_cov.outputs.python_coverage }}
          THRESH=${{ env.COVERAGE_THRESHOLD }}
          if (( $(echo "$PY_COV < $THRESH" | bc -l) )); then
            echo "❌ Python coverage $PY_COV% is below threshold $THRESH%"
            exit 1
          fi
          echo "✅ Coverage gate passed: Python $PY_COV% >= $THRESH%"

  # ── Contract Tests ─────────────────────────────────────────────────────
  contract-test:
    name: API Contract Test
    runs-on: ubuntu-latest
    needs: [python-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          pip install -r runtime/backend/requirements.txt

      - name: Run API contract tests
        run: |
          cd runtime/backend
          pytest tests/test_api.py tests/test_auth.py tests/test_entitlements_api.py tests/test_stripe_checkout_safety.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime/backend

  # ── Summary ────────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-unit, node-unit, e2e, data-isolation, coverage-gate, contract-test]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## 🧪 Test Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Unit | ${{ needs.python-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node Unit | ${{ needs.node-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Authorization & Market Isolation | ${{ needs.data-isolation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Gate | ${{ needs.coverage-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Test | ${{ needs.contract-test.result }} |" >> $GITHUB_STEP_SUMMARY
