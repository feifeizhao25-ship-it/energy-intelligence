name: Production Runtime Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate required deployment secrets
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          SSM_INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$SSM_INSTANCE_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: energy-production-audit

      - name: Collect sanitized production facts through SSM
        env:
          INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          PAYLOAD=$(python3 - <<'PY'
          import json

          commands = [
              "set -euo pipefail",
              "echo '=== host ==='",
              "uname -a",
              "df -h / /opt 2>/dev/null || df -h /",
              "free -h 2>/dev/null || true",
              "echo '=== energy directories ==='",
              "find /opt -maxdepth 3 -type d -name '*energy*' -o -path '/opt/energy/*' 2>/dev/null | sort | head -120",
              "echo '=== compose files ==='",
              "find /opt -maxdepth 4 -type f \\( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \\) 2>/dev/null | sort",
              "echo '=== running containers ==='",
              "docker ps -a --format 'table {{.Names}}\\t{{.Image}}\\t{{.Status}}\\t{{.Ports}}'",
              "echo '=== energy environment variable names only ==='",
              "for f in /opt/energy/.env /opt/energy-runtime/.env; do if [ -f \"$f\" ]; then echo \"[$f]\"; sed -n 's/^\\([A-Za-z_][A-Za-z0-9_]*\\)=.*/\\1/p' \"$f\" | sort -u; fi; done",
              "echo '=== caddy mounts and networks ==='",
              "for c in $(docker ps -a --format '{{.Names}}' | grep -E 'caddy|gateway' || true); do echo \"[$c]\"; docker inspect --format 'image={{.Config.Image}} networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}} mounts={{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' \"$c\"; done",
              "echo '=== deployed static release marker ==='",
              "grep -o 'energy-release[^>]*' /opt/energy/web/index.html 2>/dev/null | head -1 || true",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 180 \
            --parameters "$PAYLOAD" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          test "$STATUS" = "Success"
