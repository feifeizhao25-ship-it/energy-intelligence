name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY to confirm a production deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact production confirmation
        run: test "${{ inputs.confirm_production }}" = "DEPLOY"

  deploy:
    needs: confirmation
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The production site is the static export of web-global
      # (next.config.js sets output: 'export'). CI builds this package the
      # same way, and the export needs no secrets: NEXT_PUBLIC_API_URL is
      # intentionally unset so the app calls same-origin relative paths,
      # matching what is live today.
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 8.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm --dir web-global build
      - name: Package static export
        run: |
          set -euo pipefail
          test -f web-global/out/index.html
          tar -czf /tmp/energy-web.tar.gz -C web-global/out .
          ls -lh /tmp/energy-web.tar.gz

      # SSH to port 22 is unreachable from GitHub-hosted runners. The
      # instance SSM agent is online, so the deploy channel is S3 + SSM:
      # the runner pushes the packaged export to S3 and the instance pulls
      # it via a presigned URL (the instance has no verified awscli, curl
      # is the reliable path).
      # Required secrets: AWS_DEPLOY_ROLE_ARN, SSM_INSTANCE_ID.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: energy-deploy

      - name: Upload release artifact
        id: upload
        env:
          BUCKET: energy-deploy-artifacts-664308058917
        run: |
          set -euo pipefail
          aws s3 cp /tmp/energy-web.tar.gz "s3://$BUCKET/releases/${{ github.run_id }}.tar.gz"
          URL=$(aws s3 presign "s3://$BUCKET/releases/${{ github.run_id }}.tar.gz" --expires-in 3600)
          echo "presigned=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$URL"

      # /opt/energy/web is bind-mounted into the energy-caddy container
      # (ro). A bind mount pins the inode, so the directory itself must
      # never be replaced — only its contents are swapped.
      - name: Deploy to server via SSM
        env:
          INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          PAYLOAD=$(RUN_ID="${{ github.run_id }}" PRESIGNED="${{ steps.upload.outputs.presigned }}" python3 - <<'PY'
          import json, os
          run_id = os.environ["RUN_ID"]
          commands = [
            "set -euo pipefail",
            "export HOME=/root PATH=/usr/local/bin:/usr/bin:/bin:$PATH",
            f'curl -fsSL "{os.environ["PRESIGNED"]}" -o /tmp/energy-web-{run_id}.tar.gz',
            f"rm -rf /tmp/energy-web-new-{run_id} && mkdir -p /tmp/energy-web-new-{run_id}",
            f"tar -xzf /tmp/energy-web-{run_id}.tar.gz -C /tmp/energy-web-new-{run_id}",
            f"test -f /tmp/energy-web-new-{run_id}/index.html",
            f"cp -a /opt/energy/web /opt/energy/web.bak.{run_id}",
            "find /opt/energy/web -mindepth 1 -delete",
            f"cp -a /tmp/energy-web-new-{run_id}/. /opt/energy/web/",
            "chown -R 501:0 /opt/energy/web",
            f"rm -rf /tmp/energy-web-new-{run_id} /tmp/energy-web-{run_id}.tar.gz",
            # Health gate: Caddy must serve exactly the bytes we deployed.
            # Public DNS is not delegated, so resolve the vhost to localhost.
            "for i in $(seq 1 15); do if curl -sk --resolve energyiq.tianji-astrology.com:443:127.0.0.1 https://energyiq.tianji-astrology.com/ | cmp -s - /opt/energy/web/index.html; then echo 'Site healthy: served bytes match deployed export'; exit 0; fi; sleep 2; done",
            "echo 'Health check failed: served content does not match deployed export' >&2",
            "exit 1",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters "$PAYLOAD" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          test "$STATUS" = "Success"

      - name: Prune old backups on server
        if: success()
        env:
          INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 120 \
            --parameters '{"commands":["export HOME=/root","ls -1d /opt/energy/web.bak.* 2>/dev/null | sort -t. -k3 -n | head -n -5 | xargs -r rm -rf","ls -1d /opt/energy/web.bak.* 2>/dev/null || true"]}' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent]' --output text || true

      - name: Cleanup release artifact
        if: always()
        env:
          BUCKET: energy-deploy-artifacts-664308058917
        run: |
          aws s3 rm "s3://$BUCKET/releases/${{ github.run_id }}.tar.gz" || true
