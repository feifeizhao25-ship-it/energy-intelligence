name: Release Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/energy-intelligence

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./后端
            dockerfile: ./后端/Dockerfile
          - name: frontend-cn
            context: .
            dockerfile: ./frontend-cn-web/Dockerfile
          - name: frontend-int
            context: .
            dockerfile: ./web-global/Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ inputs.tag }}
