name: Knowledge improvement audit

# 生产代码在 runtime/backend。本工作流只跑离线检查，不调用模型、地图、支付或短信，也不自动发布。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/knowledge-improvement.yml"
      - "runtime/backend/app/services/continuous_improvement.py"
      - "runtime/backend/app/services/rag_refresh.py"
      - "runtime/backend/data/improvement/watchlist.yaml"
      - "runtime/backend/scripts/knowledge_improvement_audit.py"
      - "runtime/backend/tests/test_continuous_improvement.py"
      - "runtime/backend/tests/test_rag_sources.py"
      - "runtime/backend/tests/test_knowledge_improvement_paths.py"
      - "automation/domestic_research/cycle.py"
      - ".agents/skills/cn-energy-evidence/SKILL.md"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate improvement controls
        run: >
          pytest -q
          tests/test_knowledge_improvement_paths.py
          tests/test_continuous_improvement.py
          tests/test_rag_sources.py
      - name: Produce freshness report
        run: |
          python - <<'PY'
          import json
          from app.services.rag_refresh import refresh_report
          with open("knowledge-freshness.json", "w", encoding="utf-8") as output:
              json.dump(refresh_report(), output, ensure_ascii=False, indent=2)
          PY
      - name: Build quarantined candidate report
        run: python scripts/knowledge_improvement_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-improvement-audit
          path: |
            runtime/backend/knowledge-freshness.json
            runtime/backend/knowledge-improvement-candidates.json
          retention-days: 30
