name: Knowledge improvement audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/knowledge-improvement.yml"
      - "后端/app/services/continuous_improvement.py"
      - "后端/app/services/openrouter_client.py"
      - "后端/app/services/rag_refresh.py"
      - "后端/data/improvement_sources.json"
      - "后端/scripts/knowledge_improvement_audit.py"
      - "后端/tests/test_continuous_improvement.py"
      - "后端/tests/test_rag_sources.py"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 后端
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 后端/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate improvement controls
        run: >
          pytest -q
          tests/test_continuous_improvement.py
          tests/test_rag_sources.py
      - name: Produce freshness report
        run: |
          python - <<'PY'
          import json
          from app.services.rag_refresh import refresh_report
          with open("knowledge-freshness.json", "w", encoding="utf-8") as output:
              json.dump(refresh_report(), output, ensure_ascii=False, indent=2)
          PY
      - name: Build quarantined candidate report
        run: python scripts/knowledge_improvement_audit.py --online
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-improvement-audit
          path: |
            后端/knowledge-freshness.json
            后端/knowledge-improvement-candidates.json
          retention-days: 30
