    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CN_DOMAIN: ${CN_DOMAIN:?CN_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./Caddyfile.cn:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
