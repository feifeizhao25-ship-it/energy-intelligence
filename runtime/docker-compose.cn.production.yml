      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    expose:
    - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /app/.next/cache:size=256m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
