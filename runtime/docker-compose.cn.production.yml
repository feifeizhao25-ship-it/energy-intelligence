# Generated by scripts/render_cn_compose.py; review changes before deployment.
name: energy-intelligence-cn
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: energy_api
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U energy -d energy_api
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - backend
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - backend
  backend:
    build: ./backend
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/energy-api:${IMAGE_TAG:?IMAGE_TAG
      is required}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: 'false'
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+asyncpg://energy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD
        is required}@postgres:5432/energy_api
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:?ALIPAY_SELLER_ID is required}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:?ALIPAY_PRIVATE_KEY is required}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:?ALIPAY_PUBLIC_KEY is required}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:?ALIPAY_NOTIFY_URL is required}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:?ALIPAY_RETURN_URL is required}
      ALIPAY_SANDBOX: 'false'
      ALIPAY_GATEWAY_URL: https://openapi.alipay.com/gateway.do
      SENTRY_DSN: ${SENTRY_DSN:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /app/logs:size=128m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  web-cn:
    build:
      context: ./web
      args:
        # 国内版不接境外托管数据库（2026-09-21 口径）。
        # 此前这三个 SUPABASE 变量都是 :?required —— 没有 Supabase
        # 国内栈根本起不来，而 Supabase 托管在境外，用户数据落到境外
        # 会触发 PIPL 的数据出境规则，不是配个变量能解决的。
        # 现在 scripts/validate-public-build-config.mjs 反过来拦：
        # 国内版**出现** Supabase 配置就构建失败。
        NEXT_PUBLIC_APP_EDITION: cn
        NEXT_PUBLIC_API_URL: ${CN_PUBLIC_API_URL:?CN_PUBLIC_API_URL is required}
        BACKEND_INTERNAL_URL: http://backend:8000
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/energy-web-cn:${IMAGE_TAG:?IMAGE_TAG
      is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://energy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is
        required}@postgres:5432/energy_web
      DIRECT_URL: postgresql://energy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/energy_web
      NEXTAUTH_URL: ${CN_NEXTAUTH_URL:?CN_NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_APP_EDITION: cn
      OPENALEX_CONTACT_EMAIL: ${OPENALEX_CONTACT_EMAIL:?OPENALEX_CONTACT_EMAIL is
        required}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:?ALIPAY_SELLER_ID is required}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:?ALIPAY_PRIVATE_KEY is required}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:?ALIPAY_PUBLIC_KEY is required}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:?ALIPAY_NOTIFY_URL is required}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:?ALIPAY_RETURN_URL is required}
      ALIPAY_SANDBOX: 'false'
      ALIPAY_GATEWAY_URL: https://openapi.alipay.com/gateway.do
      BACKEND_INTERNAL_URL: http://backend:8000
    expose:
    - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /app/.next/cache:size=256m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CN_DOMAIN: ${CN_DOMAIN:?CN_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./Caddyfile.cn:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      web-cn:
        condition: service_healthy
    networks:
    - backend
    security_opt:
    - no-new-privileges:true
volumes:
  postgres_data: null
  redis_data: null
  caddy_data: null
  caddy_config: null
networks:
  backend:
    driver: bridge
