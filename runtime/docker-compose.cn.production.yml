      NENGJIAN_BAIDU_SITE: ${NENGJIAN_BAIDU_SITE:-}
      NENGJIAN_INTERNAL_TOKEN: ${NENGJIAN_INTERNAL_TOKEN:-}
      NENGJIAN_FEEDBACK_PATH: ${NENGJIAN_FEEDBACK_PATH:-}
      GLM_MODEL: glm-4.7-flash
      NENGJIAN_USER_DAILY_BUDGET_CNY: ${NENGJIAN_USER_DAILY_BUDGET_CNY:-20}
      NENGJIAN_USER_MONTHLY_BUDGET_CNY: ${NENGJIAN_USER_MONTHLY_BUDGET_CNY:-200}
      NENGJIAN_MODEL_CALL_CNY: ${NENGJIAN_MODEL_CALL_CNY:-0.01}
      NENGJIAN_BOTTOM_LINE_MODEL_REVIEW: ${NENGJIAN_BOTTOM_LINE_MODEL_REVIEW:-0}
