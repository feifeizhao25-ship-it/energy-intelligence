      NENGJIAN_OPENCLAW_SECRETS_FILE: ${NENGJIAN_OPENCLAW_SECRETS_FILE:-/etc/airui-nengjian/openclaw.env}
    healthcheck:
      test:
      - CMD-SHELL
      - 'curl --fail --silent http://127.0.0.1:8000/health | grep -q ''"database":
        "ok"'''
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
    - reports_data:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /app/logs:size=128m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  web-cn:
