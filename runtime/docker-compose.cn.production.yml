      NENGJIAN_GEO_DOUBAO_MODEL: ${NENGJIAN_GEO_DOUBAO_MODEL:-}
      NENGJIAN_GEO_WENXIN_MODEL: ${NENGJIAN_GEO_WENXIN_MODEL:-}
      NENGJIAN_GEO_QWEN_MODEL: ${NENGJIAN_GEO_QWEN_MODEL:-}
      NENGJIAN_BAIDU_PUSH_TOKEN: ${NENGJIAN_BAIDU_PUSH_TOKEN:-}
      NENGJIAN_BAIDU_SITE: ${NENGJIAN_BAIDU_SITE:-}
      NENGJIAN_INTERNAL_TOKEN: ${NENGJIAN_INTERNAL_TOKEN:-}
      NENGJIAN_FEEDBACK_PATH: ${NENGJIAN_FEEDBACK_PATH:-}
      GLM_MODEL: glm-4.7-flash
      NENGJIAN_USER_DAILY_BUDGET_CNY: ${NENGJIAN_USER_DAILY_BUDGET_CNY:-20}
      NENGJIAN_USER_MONTHLY_BUDGET_CNY: ${NENGJIAN_USER_MONTHLY_BUDGET_CNY:-200}
      NENGJIAN_MODEL_CALL_CNY: ${NENGJIAN_MODEL_CALL_CNY:-0.01}
      NENGJIAN_BOTTOM_LINE_MODEL_REVIEW: ${NENGJIAN_BOTTOM_LINE_MODEL_REVIEW:-0}
      NENGJIAN_MEDIA_ENABLED: ${NENGJIAN_MEDIA_ENABLED:-0}
      NENGJIAN_OPENCLAW_SECRETS_FILE: ${NENGJIAN_OPENCLAW_SECRETS_FILE:-/etc/airui-nengjian/openclaw.env}
    healthcheck:
      disable: true
    volumes:
    - reports_data:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /app/logs:size=128m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    command:
    - celery
    - -A
    - app.tasks.celery_app
    - beat
    - --loglevel=info
    - --pidfile=/tmp/celery-beat.pid
    - --schedule
    - /tmp/celerybeat-schedule
  membership-cron:
    image: alpine:3.20
    restart: unless-stopped
    command:
    - sh
    - -c
    - 'while true; do wget -qO- --header="Authorization: Bearer $$CRON_SECRET" --post-data=""
      http://web-cn:3000/api/cron/membership >/dev/null || true; sleep 60; done'
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
    depends_on:
      web-cn:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
volumes:
  postgres_data: null
  redis_data: null
  caddy_data: null
  caddy_config: null
  reports_data: null
networks:
  backend:
    driver: bridge
