      NENGJIAN_WECOM_AGENT_ID: ${NENGJIAN_WECOM_AGENT_ID:-}
      NENGJIAN_WECOM_SECRET: ${NENGJIAN_WECOM_SECRET:-}
      NENGJIAN_WECOM_TOKEN: ${NENGJIAN_WECOM_TOKEN:-}
      NENGJIAN_WECOM_AES_KEY: ${NENGJIAN_WECOM_AES_KEY:-}
