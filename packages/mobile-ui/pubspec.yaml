name: mobile_ui
description: 新能源智库移动端UI组件库
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 图表
  fl_chart: ^0.70.0
  syncfusion_flutter_charts: ^28.1.33
  
  # 没有地图页。amap_flutter_location 未使用，已去掉，避免看起来像已经接了高德。
  
  # UI增强
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.0
  pull_to_refresh_flutter3: ^2.0.2
  
  # 工具
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
